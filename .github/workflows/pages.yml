name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  # Отменять идущий деплой нельзя: сайт остаётся наполовину обновлённым.
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      # pnpm/setup ставит pnpm и Node и выполняет pnpm install сам.
      # require-lockfile: без него он молча собрал бы по.registry-зависимостям.
      - uses: pnpm/setup@v3
        with:
          version: 12
          runtime: node@24
          require-lockfile: true
          cache: true

      - run: pnpm build

      - uses: actions/upload-pages-artifact@v5
        with:
          path: build

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
