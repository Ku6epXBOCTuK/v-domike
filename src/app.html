<!doctype html>
<html lang="ru" data-theme="light">
	<head>
		<meta charset="utf-8" />
		<!-- viewport-fit=cover включает env(safe-area-inset-*): без него вырез и
		     домашняя полоса не отдают инсеты и --safe-* остаются нулями. -->
		<meta
			name="viewport"
			content="width=device-width, initial-scale=1, viewport-fit=cover"
		/>
		<script>
			const stored = localStorage.getItem("vb-theme");
			document.documentElement.dataset.theme =
				stored === "dark" || stored === "light" ? stored : "light";
		</script>
		<!-- assets — это базовый путь хостинга: ссылка останется верной и в корне
		     домена, и в подкаталоге типа github.io/repo. -->
		<link rel="manifest" href="%sveltekit.assets%/manifest.webmanifest" />
		<!-- iOS игнорирует манифест при установке и берёт иконку только отсюда,
		     причём строго PNG: на SVG отдаст скриншот страницы. -->
		<link
			rel="apple-touch-icon"
			href="%sveltekit.assets%/apple-touch-icon.png"
		/>
		<meta name="apple-mobile-web-app-capable" content="yes" />
		%sveltekit.head%
	</head>
	<body data-sveltekit-preload-data="hover">
		<div style="display: contents">%sveltekit.body%</div>
	</body>
</html>
